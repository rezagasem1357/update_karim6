workflows:
  android-workflow:
    name: Android App Bundle Build
    instance_type: mac_mini_m1
    max_build_duration: 30
    environment:
      flutter: 3.47.2
      java: 17
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Generate Launcher Icons
        script: |
          dart run flutter_launcher_icons
      - name: Clean Android build state
        script: |
          flutter clean
          rm -rf android/.gradle build
      - name: Verify Android project
        script: |
          test -f android/settings.gradle.kts
          test -f android/app/build.gradle.kts
          test -f android/gradle/wrapper/gradle-wrapper.properties
      - name: Build App Bundle (AAB)
        script: |
          flutter build appbundle --release
    artifacts:
      - build/app/outputs/bundle/release/*.aab
